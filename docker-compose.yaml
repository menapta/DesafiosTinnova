services:
  api:
      build: .
      ports:
        - "8000:8000"
      depends_on:
        - cache
        - db
      environment:
        - REDIS_HOST=cache
        - REDIS_PORT=6379
      env_file:
      - .env 
  test:
    build: .
    command: pytest -v
    depends_on:
      - cache
      - db
    env_file:
      - .env
  db:
    image: postgres:16
    restart: unless-stopped
    container_name: db
    env_file:
      - .env 
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=DB  
    ports:
      - '5432:5432'
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d/ 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:alpine
    container_name: redis_app
    restart: unless-stopped
    ports:
      - '6379:6379'
